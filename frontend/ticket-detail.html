<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detalle del ticket</title><link rel="stylesheet" href="css/persona3.css"></head>
<body><main>
  <h1 id="ticket-title">Ticket</h1>
  <!-- Persona 2: la información del ticket y los botones de estado van en este bloque -->
  <div class="card" id="ticket-info"></div>

  <div class="card">
    <h2>Comentarios</h2>
    <div id="comments-list"></div>
    <div id="comment-msg" class="msg"></div>
    <textarea id="comment-text" rows="3" maxlength="1000" placeholder="Escribe un comentario..."></textarea>
    <p><button id="comment-send">Enviar</button></p>
  </div>

  <div class="card">
    <h2>Historial</h2>
    <ul id="history-list" class="timeline"></ul>
  </div>
</main>
<script src="js/api.js"></script><script src="js/comments.js"></script><script src="js/history.js"></script>
<script>
  const ticketId = new URLSearchParams(location.search).get("id");
  (async () => {
    try {
      const t = await apiFetch(`/api/tickets/${ticketId}`);
      document.getElementById("ticket-title").textContent = `#${t.id} — ${t.title}`;
      document.getElementById("ticket-info").innerHTML =
        `<p>${esc(t.description)}</p><p><span class="badge">${esc(t.status)}</span> ${esc(t.priority)} · ${esc(t.category)}</p>`;
    } catch (e) { document.getElementById("ticket-info").textContent = e.message; }
  })();
  loadComments(ticketId); initCommentForm(ticketId); loadHistory(ticketId);
</script></body></html>
